<div class="desktop-env" (click)="currentHtmlWindowId ? null : null">
  <!-- Reloj de Escritorio -->
  <div class="desktop-clock">
    <div class="clock-time">{{ horaActual | date:'HH:mm' }}</div>
    <div class="clock-date">{{ horaActual | date:'EEEE, d MMM y' | uppercase }}</div>
  </div>

  <!-- Ventanas Flotantes -->
  <ng-container *ngFor="let win of ventanas">
    <app-ventana 
      [win]="win"
      (onCerrar)="cerrarVentana($event)"
      (onMaximizar)="toggleMaximizar($event)"
      (onEnfocar)="enfocarVentana($event)"
      (onResponder)="responderVentana($event)">
    </app-ventana>
  </ng-container>

  <!-- Barra de Comandos Inferior (Terminal Input) -->
  <div class="command-bar">
    <div class="input-wrapper">
      <mat-icon class="prompt-icon">chevron_right</mat-icon>
      <input 
        class="cyber-input"
        type="text" 
        [(ngModel)]="promptInput" 
        (keydown.enter)="ejecutarComando()" 
        placeholder="Ingrese comando para AGNUX OS..."
        [disabled]="cargando"
        autocomplete="off" />
      <button mat-icon-button class="exec-btn" (click)="ejecutarComando()" [disabled]="cargando || !promptInput">
        <mat-icon *ngIf="!cargando">send</mat-icon>
        <mat-icon *ngIf="cargando" class="spin">sync</mat-icon>
      </button>
    </div>
  </div>
</div>
