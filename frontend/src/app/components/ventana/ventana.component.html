<mat-card 
  class="cyber-window" 
  cdkDrag
  [class.maximized]="win.maximizada"
  [class.video-window]="win.tipo === 'video'"
  [style.z-index]="win.zIndex"
  [style.left.px]="win.maximizada ? 0 : win.x"
  [style.top.px]="win.maximizada ? 0 : win.y"
  (mousedown)="onEnfocar.emit(win)">
  
  <!-- Header de la Ventana -->
  <div class="window-header" cdkDragHandle>
    <div class="window-title">
      <mat-icon class="title-icon">terminal</mat-icon>
      <span>{{ win.titulo }}</span>
    </div>
    <div class="window-actions">
      <button mat-icon-button (click)="onMaximizar.emit(win)">
        <mat-icon>{{ win.maximizada ? 'flip_to_front' : 'crop_square' }}</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="onCerrar.emit(win.id)">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Contenido Dinámico -->
  <mat-card-content class="window-content" [ngSwitch]="win.tipo">
    
    <!-- TIPO HTML (Resultados de Inteligencia) -->
    <div *ngSwitchCase="'html'" class="html-container" style="display: flex; flex-direction: column; height: 100%;">
      <div class="console-output" [innerHTML]="win.htmlDinamico | safeHtml" style="flex: 1; overflow-y: auto; padding-bottom: 8px;"></div>
      
      <!-- Input de respuesta en la misma ventana -->
      <div class="window-reply-bar">
        <mat-icon class="reply-icon">subdirectory_arrow_right</mat-icon>
        <input 
          class="reply-input"
          type="text" 
          [(ngModel)]="win.replyInput" 
          (keydown.enter)="onResponder.emit(win)" 
          placeholder="Responder en este contexto..."
          [disabled]="win.cargandoRespuesta || false"
          autocomplete="off" />
        <button mat-icon-button class="reply-btn" (click)="onResponder.emit(win)" [disabled]="(win.cargandoRespuesta || false) || !win.replyInput">
          <mat-icon *ngIf="!win.cargandoRespuesta">send</mat-icon>
          <mat-icon *ngIf="win.cargandoRespuesta" class="spin">sync</mat-icon>
        </button>
      </div>
    </div>

    <!-- TIPO MUSICA (Reproductor) -->
    <div *ngSwitchCase="'musica'" class="music-container">
      <div class="pulse-ring">
        <mat-icon class="pulse-icon">graphic_eq</mat-icon>
      </div>
      <div class="track-info">Playing Neural Stream...</div>
      <div class="media-controls">
        <button mat-icon-button><mat-icon>skip_previous</mat-icon></button>
        <button mat-fab class="play-btn"><mat-icon>play_arrow</mat-icon></button>
        <button mat-icon-button><mat-icon>pause</mat-icon></button>
        <button mat-icon-button><mat-icon>skip_next</mat-icon></button>
      </div>
    </div>

    <!-- TIPO VIDEO (Reproductor) -->
    <div *ngSwitchCase="'video'" class="video-container">
      <div class="video-placeholder">
        <mat-icon>movie</mat-icon>
        <p>Reproduciendo stream de video físico...</p>
      </div>
    </div>

    <!-- TIPO TEXTO (Errores o Mensajes Cortos) -->
    <div *ngSwitchCase="'texto'" class="text-container">
      <pre>{{ win.datos?.error || win.datos }}</pre>
    </div>

  </mat-card-content>
</mat-card>
