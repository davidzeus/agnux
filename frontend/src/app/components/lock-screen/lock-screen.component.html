<div class="lock-screen-container">
  <div class="cyber-glitch-layer"></div>
  
  <div class="terminal-box">
    <h1 class="glitch-title" data-text="AGNUX OS">AGNUX OS</h1>
    
    <div class="warning-banner blinking">
      SISTEMA BLOQUEADO - ESCANEE QR CON DISPOSITIVO AGNUX VPN
    </div>
    
    <!-- Representación de QR (Simulada por directiva o qrcode) -->
    <div class="qr-placeholder">
      <div class="qr-corners top-left"></div>
      <div class="qr-corners top-right"></div>
      <div class="qr-corners bottom-left"></div>
      <div class="qr-corners bottom-right"></div>
      
      <!-- Se puede integrar ngx-qrcode u otra si el usuario lo instala. Por ahora texto directo con URL -->
      <div class="qr-code-data">
        <span class="url-text">{{ qrUrl }}</span>
      </div>
      <div class="scan-line"></div>
    </div>
    
    <div class="status-footer">
      <span>ID TERMINAL: [ {{ terminalId }} ]</span>
      <span class="status-text loading-dots">Esperando conexión biométrica</span>
    </div>
  </div>
</div>
