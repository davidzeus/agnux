<div class="agnux-container" style="max-width: 700px; margin: 40px auto; font-family: monospace; padding: 20px; background: #111; color: #0f0; border: 1px solid #00ff0033; border-radius: 8px;">
  
  <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
    <span style="color: #0f0; font-weight: bold; align-self: center;">david&#64;agnux:~$</span>
    <input 
      type="text" 
      [(ngModel)]="promptInput" 
      (keyup.enter)="ejecutarComando()"
      [disabled]="cargando"
      placeholder="¿Qué orden o consulta querés ejecutar?" 
      style="flex: 1; background: #222; border: 1px solid #333; color: #fff; padding: 10px; font-family: monospace; outline: none; border-radius: 4px;"
    />
    <button 
      (click)="ejecutarComando()" 
      [disabled]="cargando"
      style="background: #0f0; color: #000; border: none; padding: 10px 20px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 4px;">
      {{ cargando ? '...' : 'GATILLAR' }}
    </button>
  </div>

  <div *ngIf="statusMensaje" style="color: #aaffaa; margin-bottom: 10px;">
    {{ statusMensaje }}
  </div>

  <div *ngIf="errorMsg" style="color: #ff3333; background: #331111; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
    ❌ {{ errorMsg }}
  </div>

  <div *ngIf="respuestaIA" class="output-panel" style="background: #050505; border: 1px solid #222; padding: 15px; border-radius: 4px; max-height: 400px; overflow-y: auto;">
    <span style="color: #888; font-size: 11px;">[AGNUX CORE RESPONSE]</span>
    <pre style="margin: 10px 0 0 0; white-space: pre-wrap; word-wrap: break-word; color: #e0e0e0; font-size: 13px;">{{ respuestaIA }}</pre>
  </div>

</div>
