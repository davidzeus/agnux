# AGNUX OS v2.0 - Live GRUB Configuration
set default="0"
set timeout=5

# Load graphics modules for custom background splash
insmod png
insmod jpeg
insmod gfxterm
terminal_output gfxterm

# Set background wallpaper and theme colors
background_image /boot/grub/splash.jpg
set menu_color_normal=green/black
set menu_color_highlight=black/green

menuentry "AGNUX OS v2.0 Live (Bare-Metal)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "AGNUX OS v2.0 (Recovery Mode)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper single quiet splash ---
    initrd /casper/initrd
}
