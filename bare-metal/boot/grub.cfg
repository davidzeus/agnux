# AGNUX OS - Custom GRUB configuration
set default="0"
set timeout=5

# Set custom logo or background here if plymouth is configured
# background_image /boot/grub/splash.png

menuentry "AGNUX OS" {
    linux /boot/vmlinuz root=UUID=YOUR_UUID ro quiet splash vt.global_cursor_default=0
    initrd /boot/initrd.img
}

menuentry "AGNUX OS (Recovery Mode)" {
    linux /boot/vmlinuz root=UUID=YOUR_UUID ro recovery
    initrd /boot/initrd.img
}
